name: Scene preview tests
on:
  push:
    branches: [scene-renderer]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [ground_pick, preview_policy]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/${{ matrix.suite }} -B build-tests -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-tests
      - run: ctest --test-dir build-tests --output-on-failure
