name: Verify
# A task branch is checked once, by its pull request; main by its pushes.
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same branch cancels the older run.
concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-game:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/configure-build.ps1 Release
      - run: ctest --test-dir build --output-on-failure
  exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/scene_export/requirements.txt
      - run: python -m unittest discover -s tools/scene_export -p 'test*.py' -v
  scene:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [ground_pick, preview_policy, sprite_card, game_view, map_clip, embedded_fonts, fixed_screen_options, snapshot_rows, settings_3d, sun]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S ce/tests/${{ matrix.suite }} -B build-tests -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-tests --target settings_3d_tests
        if: matrix.suite == 'settings_3d'
      - run: cmake --build build-tests
        if: matrix.suite != 'settings_3d'
      - run: ctest --test-dir build-tests -R '^settings_3d_tests$' --output-on-failure
        if: matrix.suite == 'settings_3d'
      - run: ctest --test-dir build-tests --output-on-failure
        if: matrix.suite != 'settings_3d'
