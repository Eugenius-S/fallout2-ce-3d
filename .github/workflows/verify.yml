name: Scene exporter tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/scene_export/requirements.txt
      - run: python -m unittest discover -s tools/scene_export -p 'test*.py' -v
