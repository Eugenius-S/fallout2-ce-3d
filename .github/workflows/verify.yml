name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/scene_export/requirements.txt
      - run: python -m unittest discover -s tools/scene_export -p 'test*.py' -v
  scene:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [ground_pick, preview_policy, sprite_card, game_view, embedded_fonts, fixed_screen_options]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S ce/tests/${{ matrix.suite }} -B build-tests -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-tests
      - run: ctest --test-dir build-tests --output-on-failure
