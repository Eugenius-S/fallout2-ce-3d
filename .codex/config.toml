# Codex settings for this repository. Codex reads them only when the folder
# is trusted in ~/.codex/config.toml.
model_reasoning_effort = "medium"

# The global skill list costs ~10k tokens on every request; this repo needs none.
[skills]
include_instructions = false

[features]
plugins = false
apps = false
multi_agent = false
image_generation = false

[mcp_servers.node_repl]
enabled = false

[mcp_servers.pencil]
enabled = false

[mcp_servers.buffer]
enabled = false

[mcp_servers.mobbin]
enabled = false

[mcp_servers.parallel-search]
enabled = false

[mcp_servers.icons8mcp]
enabled = false
